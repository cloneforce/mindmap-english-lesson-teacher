    const subText = document.getElementById("subText");
    function setSub(){ const n = PLAYABLE_NODES[currentIdx]; subText.textContent = n && LEAF[n.id] ? LEAF[n.id].text : ""; }
    function expandTo(nodeId){ (function ex(n,path){ if(n.id===nodeId){ path.forEach(p=>p.collapsed=false); return true;} if(n.children){ for(const c of n.children){ if(ex(c,path.concat([n]))) return true; } } return false; })(TREE_DATA,[]); }
    function loadTopic(tid, offset, play){
      if (curTopic !== tid || !audioEl.src) {
        curTopic = tid;
        audioEl.loop = true;
        audioEl.src = TOPICS[tid].url;
        audioEl.addEventListener("loadedmetadata", () => { audioEl.currentTime = offset; if (play) audioEl.play().catch(()=>{}); }, { once: true });
        audioEl.load();
      } else {
        audioEl.currentTime = offset;
        if (play) audioEl.play().catch(()=>{});
      }
    }
    window.selectNode = function(nodeId) {
      const idx = PLAYABLE_NODES.findIndex(n => n.id === nodeId);
      if (idx === -1) return;
      if (currentIdx === idx && curTopic && !audioEl.paused) { audioEl.pause(); syncPlayerUI(); return; }
      currentIdx = idx;
      expandTo(nodeId);
      loadTopic(LEAF[nodeId].topic, LEAF[nodeId].s + 0.01, true);
      setSub(); syncPlayerUI();
    };
    window.togglePlayPause = function() {
      if (!curTopic) { const n = PLAYABLE_NODES[currentIdx]; loadTopic(LEAF[n.id].topic, LEAF[n.id].s, true); syncPlayerUI(); return; }
      if (audioEl.paused) audioEl.play().catch(()=>{}); else audioEl.pause();
      syncPlayerUI();
    };
    audioEl.addEventListener("play", syncPlayerUI);
    audioEl.addEventListener("pause", syncPlayerUI);
    function tick(){
      if (curTopic && audioEl.readyState >= 1) {
        const t = audioEl.currentTime, ids = TOPICS[curTopic].ids;
        let id = ids[0];
        for (const k of ids) { if (LEAF[k].s <= t) id = k; else break; }
        const idx = PLAYABLE_NODES.findIndex(n => n.id === id);
        if (idx !== currentIdx) { currentIdx = idx; expandTo(id); setSub(); syncPlayerUI(); }
      }
    }
    (function loop(){ if (!audioEl.paused) tick(); requestAnimationFrame(loop); })();
    audioEl.addEventListener("seeked", tick);
    audioEl.addEventListener("timeupdate", () => {
      if (audioEl.duration) {
        seekSlider.value = (audioEl.currentTime / audioEl.duration) * 100;

    });
